# ====================================================================
# Real-Protein Docking Benchmark: E2A-HPr (Accelerated GPU)
# ====================================================================

run_dir = "run-e2a-hpr-gpu"
mode = "local"
ncores = 4
use_gpu = true
gpu_devices = [0]
gpu_platform = "auto"

molecules = [
    "data/e2aP_1F3G.pdb",
    "data/hpr_ensemble.pdb"
]

[topoaa]
autohis = false
[topoaa.mol1]
nhisd = 0
nhise = 1
hise_1 = 75
[topoaa.mol2]
nhisd = 1
hisd_1 = 76
nhise = 1
hise_1 = 15

[rigidbody]
tolerance = 20
ambig_fname = "data/e2a-hpr_air.tbl"
sampling = 20

[caprieval]
reference_fname = "data/e2a-hpr_1GGR.pdb"

[seletop]
select = 10

[flexref]
tolerance = 20
ambig_fname = "data/e2a-hpr_air.tbl"

[clustfcc]
min_population = 1

[rmsdmatrix]

[seletopclusts]
top_models = 4

[caprieval]
reference_fname = "data/e2a-hpr_1GGR.pdb"
