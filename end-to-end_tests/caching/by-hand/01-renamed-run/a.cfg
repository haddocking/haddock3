# Scenario 1a: an ordinary run. Nothing here is special -- every HADDOCK3 run
# is automatically usable as a cache, with no extra flags and no setup.
run_dir = "run-a"

mode = "local"
ncores = 8

# Keep the outputs uncompressed so you can see the file names plainly.
clean = false
postprocess = false

molecules = [
    "../../../examples/docking-protein-protein/data/e2aP_1F3G.pdb",
    "../../../examples/docking-protein-protein/data/hpr_ensemble.pdb",
    ]

[topoaa]
autohis = false
[topoaa.mol1]
nhisd = 0
nhise = 1
hise_1 = 75
[topoaa.mol2]
nhisd = 1
hisd_1 = 76
nhise = 1
hise_1 = 15

[rigidbody]
tolerance = 20
ambig_fname = "../../../examples/docking-protein-protein/data/e2a-hpr_air.tbl"
sampling = 10
