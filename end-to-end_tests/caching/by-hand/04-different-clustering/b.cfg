# Scenario 4b: the same docking, clustered slightly differently.
# Changing min_population changes which models end up in which cluster, so
# the refined models arrive under DIFFERENT NAMES and at different ranks.
run_dir = "run-b"

mode = "local"
ncores = 8
clean = false
postprocess = false

molecules = [
    "../../../examples/docking-protein-protein/data/e2aP_1F3G.pdb",
    "../../../examples/docking-protein-protein/data/hpr_ensemble.pdb",
    ]

[topoaa]
autohis = false
[topoaa.mol1]
nhisd = 0
nhise = 1
hise_1 = 75
[topoaa.mol2]
nhisd = 1
hisd_1 = 76
nhise = 1
hise_1 = 15

[rigidbody]
tolerance = 20
ambig_fname = "../../../examples/docking-protein-protein/data/e2a-hpr_air.tbl"
sampling = 40

[clustfcc]
min_population = 1

[seletopclusts]
top_clusters = 3
top_models = 2

[flexref]
tolerance = 20
ambig_fname = "../../../examples/docking-protein-protein/data/e2a-hpr_air.tbl"
